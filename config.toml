# Gorgon config
# Each peer must run gorgon with the same stream_port configured.
# Add one [[peers]] entry per remote participant.

bind_port   = 9000   # UDP port for OSC control messages
stream_port = 9001   # UDP port for audio/CV streaming (must match on every machine)

# ES-9 channel map (it exposes 16 in / 16 out over USB; channel indices below are 0-based):
#   INPUTS:   panel input jack N  ->  index N-1     (the 14 analogue inputs = idx 0..13)
#   OUTPUTS:  panel 1/8" out  N   ->  index N+7     (the 8 modular outputs  = idx 8..15)
#     output idx 0-1 = Main 1/4" L/R, 2-3 = headphone, 4-5 = S/PDIF, 6-7 = ES-5
#     -> the 1/8" modular jacks are USB outputs 9-16, so output_channels MUST be 16.
[audio]
# Use the "plughw" device so ALSA converts to the f32/48k format gorgon uses.
# (The bare "hw:CARD=ES9" device wants the ES-9's exact native format.)
input_device  = "plughw:CARD=ES9"
output_device = "plughw:CARD=ES9"
input_channels  = 14   # the 14 analogue inputs (idx 0..13)
output_channels = 16   # MUST be 16 to reach the 1/8" outputs (idx 8..15)

# --- Peers --------------------------------------------------------------------
# Routing is a two-sided contract:
#   send = [..]          local INPUT indices to transmit, IN ORDER. The order
#                        defines the channel positions in the packet: send[0]
#                        becomes packet channel 0, send[1] -> packet channel 1, ...
#   recv = [[a, b], ..]  packet channel `a` (a position in THIS peer's send list)
#                        -> local OUTPUT index `b`. Several may sum into one output.
# Omit send/recv for a straight positional mapping.

[[peers]]
name = "lizard"
addr = "100.90.90.25:9000"     # peer's Tailscale IP + their bind_port
# Send my input jacks 1-4 (idx 0-3) to lizard:
send = [0, 1, 2, 3]
# Put lizard's first 4 sent channels onto my 1/8" outputs 1-4 (idx 8-11):
recv = [[0, 8], [1, 9], [2, 10], [3, 11]]
