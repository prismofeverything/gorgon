[package]
name = "gorgon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gorgon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
cpal = "0.15"
ringbuf = "0.4"
libc = "0.2"
