[package]
name = "gorgon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gorgon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
cpal = "0.15"
ringbuf = "0.4"
libc = "0.2"

# Linux-only: create native virtual audio devices via PipeWire.
# Links the system libpipewire-0.3; the v0_3_* feature gate must not exceed the
# installed library (1.0.7 here). bytemuck reinterprets the mapped byte buffer
# as f32 in the real-time process callback.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.8", features = ["v0_3_65"] }
bytemuck = "1"
